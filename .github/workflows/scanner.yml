name: ROMYO Mother Candle Scanner

on:
  schedule:
    # 30m candles close at 9:45, 10:15 ... 15:15, 15:30 IST. Runs 2 min after each close.
    # (UTC = IST - 5:30)  ->  09:47 IST to 15:17 IST
    - cron: "17,47 4-9 * * 1-5"
    # 15:32 IST (last 15 min candle 15:15-15:30)
    - cron: "2 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save state (sent signals)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add mc_state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "update scanner state"
            git pull --rebase
            git push
          fi
