name: Squeeze Signal Scanner

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5' # Indian Market Time (Every 15 min from 9:00 AM to 3:30 PM IST)
  workflow_dispatch: # Manual run trigger button in GitHub Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Main Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
