name: FnO VIX Mix Scanner

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send Test Alert on Telegram?'
        required: false
        default: 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Market Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: python main.py
