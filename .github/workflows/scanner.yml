name: ROMYO Confirmed MC Scanner

on:
  schedule:
    # Candle close IST: 9:45, 10:15 ... 15:30  (UTC = IST - 5:30)
    # Runs 2 min after each candle close, Mon-Fri
    - cron: "17,47 4-9 * * 1-5"   # 09:47 IST -> 15:17 IST
    - cron: "17 10 * * 1-5"       # 15:47 IST (last 15:15 candle)
  workflow_dispatch:
    inputs:
      reset_state:
        description: "true = state delete karke fresh first run (pichle working day ke signals dobara)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: romyo-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Reset state (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_state == 'true' }}
        run: rm -f romyo_state.json

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add romyo_state.json || true
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "update scanner state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
