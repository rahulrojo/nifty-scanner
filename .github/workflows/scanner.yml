name: Run Vix_Mix Bot

on:
  workflow_dispatch: # Direct Manual Run button ke liye
  schedule:
    - cron: '0/30 3-10 * * 1-5' # Mon-Fri, Market hours me har 30 min me automatic run hoga

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-python: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
