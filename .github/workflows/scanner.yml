name: FnO VIX Mix Scanner

on:
  schedule:
    # Monday to Friday (Indian Market Hours: 9:15 AM se 3:30 PM IST ke bich har 15 min)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Market Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
