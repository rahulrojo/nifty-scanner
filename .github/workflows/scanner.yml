name: ROMYO 30 Minute Scanner

on:
  workflow_dispatch:

  schedule:
    # Runs every 30 minutes during the approximate NSE session.
    # GitHub uses UTC; 04:20 UTC = 09:50 IST.
    - cron: "20,50 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: romyo-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run ROMYO scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: |
          python main.py

      - name: Save signal state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update ROMYO scanner state"
              git push
            fi
          fi
