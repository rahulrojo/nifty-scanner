name: Mother Candle Scanner

on:
  schedule:
    # 30m candle close ke baad (IST 09:47 se 15:47), Mon-Fri.  UTC = IST - 5:30
    - cron: "17,47 4-9 * * 1-5"
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
    inputs:
      scan_date:
        description: "Kisi purane din ke signals chahiye? YYYY-MM-DD (khali = aaj)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mother-candle-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
        run: python main.py

      - name: Save sent-state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add sent_signals.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update sent signals"
            git pull --rebase
            git push
          fi
