name: Romyo 30m Scanner

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Telegram test message"
        required: true
        type: boolean
        default: true

  schedule:
    # 30-minute schedule, UTC.
    # 09:45, 10:15, 10:45 ... IST
    - cron: "15,45 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: romyo-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_message || false }}
          TZ: Asia/Kolkata
        run: python main.py

      - name: Save signal state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Romyo signal state"
              git push
            fi
          fi
