name: ROMYO Mother Candle Scanner

on:
  workflow_dispatch:

  schedule:
    # Every 30 minutes during NSE trading hours
    - cron: '15,45 3-10 * * 1-5'

permissions:
  contents: write

jobs:
  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install yfinance pandas numpy requests

      - name: Run ROMYO Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save Signal State
        run: |
          git config user.name "ROMYO Scanner"
          git config user.email "romyo-scanner@users.noreply.github.com"
          git add signal_state.json
          git diff --cached --quiet || git commit -m "Update ROMYO signal state"
          git push
