name: Squeeze Alerts

on:
  schedule:
    # UTC cron. 30m candle band hone ke 3 min baad run (IST 9:48 se 15:48 tak)
    - cron: '18,48 4-9 * * 1-5'
    - cron: '18 10 * * 1-5'
  workflow_dispatch:      # manual run (aaj ke saare messages ke liye pehli baar yahin se chalao)

permissions:
  contents: write         # state.json commit karne ke liye

concurrency:
  group: squeeze-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run squeeze alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python squeeze_alerts.py

      - name: Save state (duplicate alerts rokne ke liye)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
