name: Mother Candle 30M Scanner

on:
  schedule:
    # Runs every 30 minutes during NSE Market Hours (09:15 AM to 03:30 PM IST)
    # 03:45 UTC to 10:15 UTC (Mon-Fri)
    - cron: '15,45 3-9 * * 1-5'
  workflow_dispatch: # Manual Run button

jobs:
  scan_and_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Mother Candle Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
