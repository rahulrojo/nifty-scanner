name: scanner

on:
  schedule:
    # 15m candles: IST 09:31 se 15:16 tak har 15 min (UTC 04:01 - 09:46), phir last candle IST 15:31
    - cron: '1,16,31,46 4-9 * * 1-5'
    - cron: '1 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = pehli baar Friday + phir live | friday = Friday ke signals dobara bhejo"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - friday

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python main.py

      - name: Save state
        if: success()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "update scanner state"
            git push
          fi
