name: Mother Candle Scanner

on:
  schedule:
    # 30m candle band hone ke 2 min baad (IST 09:47 se 15:17, phir 15:32)
    - cron: "17,47 4-9 * * 1-5"
    - cron: "2 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mother-candle-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRST_RUN_SESSIONS: "2"
        run: python main.py

      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
