name: 30m Squeeze Scanner

on:
  schedule:
    # Runs every 30 minutes between 03:45 UTC (9:15 AM IST) and 10:15 UTC (3:45 PM IST), Mon-Fri
    - cron: '15,45 3-9 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Select Scan Mode'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - all_today

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-10@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Scanner
        if: "${{ github.event.inputs.scan_mode != 'all_today' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python squeeze_scanner.py

      - name: Run All Today's Signals Scanner
        if: "${{ github.event.inputs.scan_mode == 'all_today' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python squeeze_scanner.py --all-today
