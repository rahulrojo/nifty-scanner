name: Romyo 15m Big Move Bot

on:
  schedule:
    # Har 15 minute par chalega market hours ke dauran (Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Actions tab se manually Run karne ke liye

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Romyo Engine
        env:
          # GitHub Secrets connect ho rahe hain
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
