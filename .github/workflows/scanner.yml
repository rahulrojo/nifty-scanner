name: Breaks and Retests Scanner 30m

on:
  schedule:
    # 30m candle close ke baad (IST 09:47 se 15:47), Mon-Fri.  UTC = IST - 5:30
    - cron: "17,47 4-9 * * 1-5"
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
    inputs:
      scan_date:
        description: "Dates YYYY-MM-DD (comma se kai: 2026-10-13,2026-10-14). Khali = aaj"
        required: false
        default: ""
      test_message:
        description: "Telegram test message bhejo? (1 = haan)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: breaks-retests-scanner-30m
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TF: "30"
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
          DEBUG_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python main_br.py

      - name: Save sent-state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add sent_br_30m.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update sent signals (breaks-retests 30m)"
            git pull --rebase
            git push
          fi
