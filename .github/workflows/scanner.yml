name: ROMYO 30m Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These runs are approximately 10:02–15:32 IST
    # and are intentionally near completed 30-minute candles.
    - cron: "32 4-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: romyo-30m-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: | python -m pip install --upgrade pip pip install yfinance pandas numpy requests 
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_MESSAGE: "false"
          MOTHER_MODE: "Auto"
        run: python main.py

      - name: Save duplicate-protection state
        if: always()
        run: | if [ -f signal_state.json ]; then git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add signal_state.json if ! git diff --cached --quiet; then git commit -m "Update ROMYO signal state [skip ci]" git push fi fi
