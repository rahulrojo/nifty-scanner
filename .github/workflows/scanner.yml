name: Stock Scanner

on:
  schedule:
    # Har 15-minute candle close hone ke 1 min baad chalega (IST ke hisaab se 9:31, 9:46, 10:01...)
    - cron: '1,16,31,46 * * * 1-5'
  workflow_dispatch: # GitHub se manually run karne ke liye

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests pytz

      - name: Run Main Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and Push Updated Signals State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_signals.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent signals history" && git push)
