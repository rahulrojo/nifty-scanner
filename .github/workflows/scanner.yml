name: Romyo 30 Minute CE PE Scanner

on:
  workflow_dispatch:

  schedule:
    # Runs every 30 minutes during the Indian market session.
    # GitHub Actions uses UTC.
    - cron: "0,30 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: romyo-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Romyo scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: |
          python main.py

      - name: Save duplicate protection state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal_state.json
            git diff --cached --quiet || (
              git commit -m "Update Romyo signal state" &&
              git push
            )
          fi
